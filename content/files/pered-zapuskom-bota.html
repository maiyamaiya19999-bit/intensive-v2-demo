<h1>Что сверить <em>перед запуском бота</em></h1>
<p class="lead">Пройди по пунктам до того, как писать кодовое слово в роликах.</p>
<ul class="check" data-id="main"><li><label><input type="checkbox"><span>Есть 4 текста от Продажника: приветствие в директе, приветствие в боте с кнопкой «Забрать урок», напоминание через 10 минут, сообщение через час со ссылкой на оплату. Без «последние места».</span></label></li><li><label><input type="checkbox"><span>Бот создан в BotFather, имя заканчивается на «bot», токен скопирован.</span></label></li><li><label><input type="checkbox"><span>В ChatPlace: шаблон «чат-бот на кодовое слово» → Telegram, токен вставлен.</span></label></li><li><label><input type="checkbox"><span>Проверка подписки на канал: если канал уже есть, бот сделан его администратором и проверка включена. Канала пока нет (он появится в модуле 9): проверку выключи, как у Романа, включишь позже.</span></label></li><li><label><input type="checkbox"><span>Запуск по /start, тексты и ссылка на урок вставлены. Ссылка открывается.</span></label></li><li><label><input type="checkbox"><span>Напоминание через 10 минут и сообщение через час настроены.</span></label></li><li><label><input type="checkbox"><span>Instagram подключён: профессиональный режим, разрешения выданы.</span></label></li><li><label><input type="checkbox"><span>Условие запуска: комментарий с кодовым словом (можно несколько), выбраны публикации.</span></label></li><li><label><input type="checkbox"><span>Приветствие с кнопкой ведёт в твоего Telegram-бота, автоответы на комментарии включены.</span></label></li><li><label><input type="checkbox"><span>Проверила сама: с другого аккаунта написала кодовое слово и дошла до урока.</span></label></li><li><label><input type="checkbox"><span>В дашборде ChatPlace появилась первая строка.</span></label></li></ul><div class="checkbar"><span class="count"></span><button type="button">Снять все галочки</button></div><div class="note"><p>Застряло — найди, на каком шаге, и сверь с видео Романа.</p></div>
